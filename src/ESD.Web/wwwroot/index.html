<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESD Control System</title>
  <meta name="description" content="Real-time ESD wrist-strap monitoring dashboard" />
  <link rel="icon" type="image/x-icon" href="/assets/logo_han.ico" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="app-shell">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">H</span>
        <div class="brand-text">
          <span class="brand-name">HAN ESD</span>
          <span class="brand-sub">Control System</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard">
          <span class="nav-icon" data-icon="dashboard"></span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" href="#/events" data-route="events">
          <span class="nav-icon" data-icon="activity"></span>
          <span class="nav-label">Live Events</span>
          <span class="nav-badge" id="live-badge" hidden>0</span>
        </a>
        <a class="nav-item" href="#/history" data-route="history">
          <span class="nav-icon" data-icon="history"></span>
          <span class="nav-label">History</span>
        </a>
        <a class="nav-item" href="#/devices" data-route="devices">
          <span class="nav-icon" data-icon="device"></span>
          <span class="nav-label">Devices</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="conn-pill" id="conn-pill" title="API connection">
          <span class="conn-dot"></span>
          <span class="conn-text">connecting…</span>
        </div>
      </div>
    </aside>

    <!-- ═══ Main ═══ -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">Dashboard</h1>
          <span class="page-sub" id="page-sub">Tổng quan hệ thống</span>
        </div>
        <div class="topbar-right">
          <span class="clock" id="clock" title="Server time">--:--:--</span>
          <button class="icon-btn" id="refresh-btn" title="Làm mới" data-icon="refresh"></button>
          <a class="icon-btn" id="settings-btn" href="#/settings" title="Cài đặt" data-icon="settings"></a>
        </div>
      </header>

      <main class="content" id="view">
        <!-- Views render here -->
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
